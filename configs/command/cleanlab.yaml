# @package _global_
command: cleanlab

# K-fold audit uses a longer frozen-backbone schedule; paths still come from env=.
train:
  epochs: 25
  warmup_epochs: 1
  unfreeze: false
  starting_block: 0
  best_objective: 0.00001
  base_lr: 0.0001

model:
  start_unfreezed: 0

cleanlab:
  n_folds: 5
  table_name: oof_predictions
  export_csv: true
