paths:
  root : "/content/inat-phenology-cv"
  data_root : "/content/inat-phenology-cv/data"
  image_dir : "/content/images"
  db_path : "/content/data/cv_photos4.parquet"
  checkpoint_path : "/content/drive/MyDrive/inat-phenology-cv/checkpoints"
  eval_db_path : "/content/drive/MyDrive/inat-phenology-cv/data/model_evaluations.duckdb"
  inference_db_path : "/content/drive/MyDrive/inat-phenology-cv/data/inference.duckdb"
  sql_dir : "/content/drive/MyDrive/inat-phenology-cv/queries"
  photo_target_dir : "/content/data/"
  optuna_storage : "sqlite:////content/drive/MyDrive/inat-phenology-cv/data/optuna.sqlite3"
  cleanlab_db_path: "/content/drive/MyDrive/inat-phenology-cv/data/cleanlab.duckdb"
  corrections_dir: "/content/drive/MyDrive/inat-phenology-cv/data/label_corrections"

dataset_params:
  source_table: "cv_photos4"
  idx_col: "observation_id"
  photo_idx_col: "photo_id"
  label_col: "label"

dataloader_params:
  batch_size: 256
  max_images: 1024
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  use_max_images: true

model_params:
  backbone: "bioclip"
  architecture: "mil_pooling"
  head_neurons: 256
  head_outputs: 1
  head_dropout_prob: 0.5
  attention_neurons: 128
  attention_dropout_prob: 0.1
  start_unfreezed: 0

training_params:
  epochs: 25
  stopping_patience: 3
  unfreeze: false
  unfreezing_patience: 3
  unfreezing_cooldown: 3
  starting_block: 1
  max_stages: 3
  block_per_stage: 1
  best_objective: 0.00001
  base_lr: 0.0001
  warmup_epochs: 1
  seed: 42

cleanlab_params:
  n_folds: 5
  table_name: "oof_predictions"
  export_csv: true
