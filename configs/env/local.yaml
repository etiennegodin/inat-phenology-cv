# @package _global_
env_name: local

model:
  dinov3:
    checkpoint_path: ${paths.data_root}/dinov3/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

paths:
  root: /home/etienne/projects/inat-phenology-cv
  data_root: ${paths.root}/data
  image_dir: ${paths.data_root}/images
  db_path: ${paths.data_root}/cv_photos4.parquet
  checkpoint_path: ${paths.data_root}/checkpoints
  eval_db_path: ${paths.data_root}/model_evaluations.duckdb
  inference_db_path: ${paths.data_root}/inference.duckdb
  sql_dir: ${paths.root}/queries
  photo_target_dir: ${paths.data_root}/test_images
  optuna_storage: sqlite:///data/optuna.sqlite3
  cleanlab_db_path: ${paths.data_root}/cleanlab.duckdb
  corrections_dir: ${paths.data_root}/label_corrections

dataloaders:
  batch_size: 32
  max_images: 64
  num_workers: 4
  pin_memory: false
  persistent_workers: false
  use_max_images: true
  gradient_accumulation_steps: 1
